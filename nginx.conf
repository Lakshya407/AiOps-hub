# SPA fallback (equivalent of netlify.toml /* -> /index.html) + sane caching.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets: cache aggressively (filenames change per build).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Everything else (incl. /login, /dashboard, /admin/*) falls back to the SPA.
  location / {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
